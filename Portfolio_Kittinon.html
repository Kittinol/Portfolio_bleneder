<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>GLB Model Loader with Animation and Buttons</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
    }

    #projectBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    #projectBtn:hover {
      background: #45a049;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
</head>

<body>
  <div id="info">
    กำลังโหลดโมเดล 3D และ HDR...<br>
    <small>ใช้เมาส์เพื่อหมุนและซูม</small>
  </div>

  <button id="projectBtn">Project</button>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
    const initialCameraPos = new THREE.Vector3(20, 4, -2);
    const initialLookAt = new THREE.Vector3(0, 0, 0);
    camera.position.copy(initialCameraPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const rgbeLoader = new THREE.RGBELoader();
    const hdrUrl = 'https://kittinol.github.io/Portfolio_bleneder/studio_small_03_1k.hdr';

    rgbeLoader.load(hdrUrl, (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = texture;
      scene.background = texture;

      document.getElementById('info').innerHTML = `
        HDR โหลดเสร็จแล้ว! กำลังโหลดโมเดล 3D...<br>
        <small>ใช้เมาส์เพื่อหมุนและซูม</small>
      `;
    });

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(5, 10, 5);
    sun.castShadow = true;
    scene.add(sun);

    const loader = new THREE.GLTFLoader();
    const modelUrl = 'https://kittinol.github.io/Portfolio_bleneder/forest_place.glb'; // เปลี่ยนเป็น cat_walk.glb ถ้าต้องการ

    let projectTextMesh = null;
    let backTextMesh = null;
    let mixer = null;
    const clock = new THREE.Clock();

    loader.load(modelUrl, (gltf) => {
      const model = gltf.scene;
      model.scale.setScalar(5);
      scene.add(model);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => {
          mixer.clipAction(clip).play();
        });
        console.log("พบ Animation:", gltf.animations.map(a => a.name));
      }

      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;

          if (child.material) {
            child.material.envMapIntensity = 1.0;
            child.material.needsUpdate = true;
          }

          const name = child.name.toLowerCase();
          if (name.includes("project")) {
            projectTextMesh = child;
            child.userData.clickable = true;
            console.log("เจอข้อความ Project:", child.name);
          }

          if (name.includes("back")) {
            backTextMesh = child;
            child.userData.clickable = true;
            console.log("เจอข้อความ Back:", child.name);
          }
        }
      });

      document.getElementById('info').innerHTML = `
        โมเดล 3D โหลดเสร็จแล้ว!<br>
        <small>คลิก Project / Back บนโมเดลเพื่อเลื่อนกล้อง</small>
      `;
    });

    function moveCameraSmooth(targetPos, lookAtPos, duration = 3000) {
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const startTime = performance.now();

      controls.enabled = false;

      function update() {
        const elapsed = performance.now() - startTime;
        const t = Math.min(elapsed / duration, 1);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        camera.position.lerpVectors(startPos, targetPos, eased);
        controls.target.lerpVectors(startTarget, lookAtPos, eased);
        camera.lookAt(controls.target);

        if (t < 1) {
          requestAnimationFrame(update);
        } else {
          controls.enabled = true;
        }
      }
      requestAnimationFrame(update);
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0 && intersects[0].object.userData.clickable) {
        renderer.domElement.style.cursor = 'pointer';
      } else {
        renderer.domElement.style.cursor = 'default';
      }
    });

    window.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        const obj = intersects[0].object;

        if (projectTextMesh && obj === projectTextMesh) {
          document.getElementById('info').innerHTML = `
            ไปที่ Project...<br><small>กรุณารอสักครู่</small>
          `;
          moveCameraSmooth(new THREE.Vector3(70, 10, 35), new THREE.Vector3(50, 0, 0), 3000);
        }

        if (backTextMesh && obj === backTextMesh) {
          document.getElementById('info').innerHTML = `
            กลับไปยังจุดเริ่มต้น...<br><small>กรุณารอสักครู่</small>
          `;
          moveCameraSmooth(initialCameraPos, initialLookAt, 3000);
        }
      }
    });

    document.getElementById('projectBtn').addEventListener('click', () => {
      document.getElementById('info').innerHTML = `
        ไปที่ Project...<br><small>กรุณารอสักครู่</small>
      `;
      moveCameraSmooth(new THREE.Vector3(75, 10, 35), new THREE.Vector3(50, 0, 0), 3000);
    });

    function animate(time) {
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      controls.update();
      sun.position.x = 30 * Math.sin(time / 3000);
      sun.position.z = 30 * Math.cos(time / 3000);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
